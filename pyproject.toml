[project]
name = "card-ranker"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.2",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint]
# Ruff's defaults plus the families chosen in the Ruff decision record
# (see docs/decisions/).
extend-select = [
    "B",    # likely bugs
    "C4",   # comprehensions
    "DTZ",  # timezone-aware dates
    "FAST", # FastAPI
    "I",    # import sorting
    "N",    # naming
    "PT",   # pytest style
    "PTH",  # pathlib
    "SIM",  # simplifications
    "UP",   # modernisation
]	

[tool.pytest.ini_options]
pythonpath = ["."]
